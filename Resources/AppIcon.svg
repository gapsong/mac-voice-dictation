<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Voice Dictation app icon: a speech bubble in which a sound wave turns into
    lines of text - speech in, text out.

    Source of truth for Resources/AppIcon.icns. After editing, regenerate it:
      Scripts/make-icon.sh

    Layout follows the macOS icon grid: 1024 canvas, 824 x 824 body at
    (100, 100) with a 185 corner radius, drop shadow below.
  -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <!-- userSpaceOnUse, so the bubble and its tail share one seamless gradient. -->
    <linearGradient id="bubble" gradientUnits="userSpaceOnUse" x1="220" y1="270" x2="804" y2="790">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Faint grain: the dark background gradient bands visibly in 8 bit
         without it; the noise dithers the steps away. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>
  </g>

  <!-- Speech bubble: tail first, the body on top hides the seam. -->
  <path d="M 350 640 L 300 795 Q 296 806 306 800 L 470 680 Z" fill="url(#bubble)"/>
  <rect x="220" y="270" width="584" height="420" rx="110" fill="url(#bubble)"/>

  <!-- Sound wave (left) ... -->
  <g fill="#fff">
    <rect x="300" y="435" width="28" height="70" rx="14"/>
    <rect x="346" y="395" width="28" height="150" rx="14"/>
    <rect x="392" y="365" width="28" height="210" rx="14"/>
    <rect x="438" y="410" width="28" height="120" rx="14"/>
  </g>
  <!-- ... becomes text (right). -->
  <g fill="#fff">
    <rect x="510" y="390" width="214" height="30" rx="15"/>
    <rect x="510" y="455" width="170" height="30" rx="15" fill-opacity="0.9"/>
    <rect x="510" y="520" width="120" height="30" rx="15" fill-opacity="0.75"/>
  </g>

  <!-- Gloss and grain over the body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" filter="url(#grain)" opacity="0.06"/>
</svg>
